<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Battle With Friend — Tournaments</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080f;--bg2:#070d18;--surface:#0b1525;--border:#162235;--border2:#1e3048;
  --accent:#00d4ff;--accent2:#ff3d5c;--gold:#ffbe00;--green:#00ff9d;
  --text:#c4d8f0;--text2:#5a7a99;--text3:#243040;
}
html,body{min-height:100%}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(0,212,255,.1) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(ellipse 100% 100% at 50% 40%,black 20%,transparent 90%);-webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 40%,black 20%,transparent 90%)}
.container{max-width:1100px;margin:0 auto;padding:32px 24px;position:relative;z-index:1}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.header h1{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 25px rgba(0,212,255,.5)}
.header-actions{display:flex;gap:12px}
.btn{border:none;border-radius:7px;font-family:'Orbitron',monospace;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all .2s;text-transform:uppercase;padding:10px 20px;font-size:9px}
.btn-primary{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(0,150,200,.1));color:var(--accent);border:1px solid rgba(0,212,255,.45);box-shadow:0 0 20px rgba(0,212,255,.1)}
.btn-primary:hover{background:linear-gradient(135deg,rgba(0,212,255,.32),rgba(0,180,230,.16));box-shadow:0 0 35px rgba(0,212,255,.3)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:rgba(255,255,255,.04);color:var(--text2);border:1px solid var(--border2)}
.btn-secondary:hover{background:rgba(255,255,255,.09);color:var(--text)}
.btn-gold{background:linear-gradient(135deg,rgba(255,190,0,.18),rgba(180,130,0,.08));color:var(--gold);border:1px solid rgba(255,190,0,.5);box-shadow:0 0 18px rgba(255,190,0,.18)}
.btn-gold:hover{background:linear-gradient(135deg,rgba(255,190,0,.3),rgba(200,150,0,.14));box-shadow:0 0 30px rgba(255,190,0,.32)}
section{background:linear-gradient(145deg,rgba(11,21,37,.95),rgba(4,8,15,.98));border:1px solid var(--border);border-radius:18px;padding:28px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35)}
section h2{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:5px;color:var(--accent);margin-bottom:20px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
section h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.create-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1;min-width:200px}
.field label{display:block;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;color:var(--text2);margin-bottom:6px;text-transform:uppercase}
.field input,.field select{width:100%;padding:12px 14px;background:rgba(4,8,15,.85);border:1px solid var(--border2);border-radius:8px;font-size:15px;color:#fff;font-family:'Rajdhani',sans-serif;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,212,255,.1)}
.size-buttons{display:flex;gap:6px}
.size-btn{padding:10px 14px;border-radius:7px;border:1px solid var(--border2);background:rgba(4,8,15,.6);color:var(--text2);font-family:'Orbitron',monospace;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;min-width:48px}
.size-btn:hover{color:var(--text);border-color:var(--accent)}
.size-btn.selected{background:rgba(0,212,255,.18);border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px rgba(0,212,255,.25)}
.tournaments-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tourn-card{background:rgba(4,8,15,.7);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:all .15s}
.tourn-card:hover{border-color:var(--border2);background:rgba(0,212,255,.04)}
.tourn-card.running{border-left-color:var(--gold)}
.tourn-card.completed{border-left-color:var(--text3);opacity:.75}
.tourn-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px}
.tourn-meta{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11px;color:var(--text2);font-family:'Orbitron',monospace;letter-spacing:1px}
.tourn-meta .pill{padding:2px 8px;border-radius:10px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25);color:var(--accent)}
.tourn-meta .pill-running{background:rgba(255,190,0,.08);border-color:rgba(255,190,0,.3);color:var(--gold)}
.tourn-meta .pill-completed{background:rgba(255,255,255,.04);border-color:var(--border2);color:var(--text2)}
.tourn-actions{display:flex;gap:8px;margin-top:6px}
.tourn-actions .btn{flex:1;width:100%;padding:8px 14px;font-size:9px}
.error-message{color:var(--accent2);font-size:11px;letter-spacing:1px;margin-top:8px;display:none;font-family:'Orbitron',monospace}
.error-message.show{display:block}
.empty{color:var(--text2);font-size:12px;font-family:'Orbitron',monospace;letter-spacing:1px;padding:16px 0;text-align:center}
@media(max-width:600px){.create-form{flex-direction:column;align-items:stretch}.field{min-width:0}.size-buttons{flex-wrap:wrap}}
</style>
<link rel="stylesheet" href="css/pixel-theme.css?v=3">
<style>
/* ── TOURNAMENT-SPECIFIC PIXEL TWEAKS ─────────────────────────────────
   Override aggiuntivi solo per la pagina tornei: griglia card più chunky,
   pill stato torneo, border-left colorato come "barra trofeo".            */
.tourn-card {
  border-left: 6px solid var(--px-accent) !important;
  padding: 14px 14px 14px 14px !important;
  display: flex !important; flex-direction: column; gap: 8px;
  position: relative;
}
.tourn-card::before {
  /* "Trofeo" decorativo: piccolo blocco angolare in alto-dx */
  content: '★';
  position: absolute;
  top: 6px; right: 8px;
  font-family: 'Press Start 2P', monospace !important;
  font-size: 10px;
  color: var(--px-gold);
  text-shadow: 1px 1px 0 var(--px-shadow);
}
.tourn-card.running   { border-left-color: var(--px-gold) !important; }
.tourn-card.running::before   { content: '⚔'; color: var(--px-gold); }
.tourn-card.completed { border-left-color: var(--px-green) !important; opacity: 0.7 !important; }
.tourn-card.completed::before { content: '✓'; color: var(--px-green); }

.tourn-name {
  font-family: 'Press Start 2P', monospace !important;
  font-size: 11px !important;
  letter-spacing: 1px !important;
  color: #fff !important;
  padding-right: 24px; /* lascia spazio al trofeo */
  line-height: 1.4 !important;
}
.tourn-meta { gap: 6px 12px !important; }
.tourn-meta .pill { font-family: 'Press Start 2P', monospace !important; font-size: 7px !important; letter-spacing: 1px !important; padding: 4px 7px !important; border-radius: 0 !important; border-width: 2px !important; }
.tourn-meta .pill-running { background: rgba(255,190,0,0.15) !important; border-color: var(--px-gold) !important; color: var(--px-gold) !important; }
.tourn-meta .pill-completed { background: rgba(0,255,157,0.10) !important; border-color: var(--px-green) !important; color: var(--px-green) !important; }

.tournaments-list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important; gap: 12px !important; }

/* Size buttons: grid 5-col fissa per simmetria */
.size-buttons { display: grid !important; grid-template-columns: repeat(5, 1fr); gap: 6px !important; }
.size-btn { min-width: 0 !important; }

/* Bottone CREATE: lampeggio pixel-art */
#createBtn {
  position: relative;
  animation: pixCreate 1.6s ease-in-out infinite;
}
@keyframes pixCreate {
  0%,100% { box-shadow: inset -2px -2px 0 0 var(--px-gold-d), inset 2px 2px 0 0 #fff080, 0 4px 0 var(--px-shadow); }
  50%     { box-shadow: inset -2px -2px 0 0 var(--px-gold-d), inset 2px 2px 0 0 #fffac0, 0 4px 0 var(--px-shadow), 0 0 16px rgba(255,190,0,0.5); }
}

/* Mobile: 1 colonna card, size-buttons fluide */
@media (max-width: 640px) {
  .tournaments-list { grid-template-columns: 1fr !important; }
  .size-buttons { grid-template-columns: repeat(5, 1fr) !important; }
  .size-btn { font-size: 8px !important; padding: 8px 4px !important; }
  .tourn-name { font-size: 10px !important; }
  .create-form { gap: 8px !important; }
  .header { gap: 8px !important; }
}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>🏆 TOURNAMENTS</h1>
    <div class="header-actions">
      <a href="/webapp2/dashboard.html" class="btn btn-secondary">← DASHBOARD</a>
    </div>
  </header>

  <section>
    <h2>CREATE TOURNAMENT</h2>
    <form id="create-form" class="create-form">
      <div class="field">
        <label for="tname">Name</label>
        <input type="text" id="tname" placeholder="e.g. Friday Cup" maxlength="80" required>
      </div>
      <div class="field" style="flex:0 0 auto">
        <label>Size</label>
        <div class="size-buttons" id="sizeButtons">
          <button type="button" class="size-btn" data-size="2">2</button>
          <button type="button" class="size-btn" data-size="4">4</button>
          <button type="button" class="size-btn selected" data-size="8">8</button>
          <button type="button" class="size-btn" data-size="16">16</button>
          <button type="button" class="size-btn" data-size="32">32</button>
        </div>
      </div>
      <button type="submit" class="btn btn-gold" id="createBtn">⚔ CREATE</button>
    </form>
    <div id="createError" class="error-message"></div>
  </section>

  <section>
    <h2>OPEN & RUNNING</h2>
    <div id="tournamentsList" class="tournaments-list">
      <p class="empty">Loading…</p>
    </div>
  </section>
</div>
<script type="module" src="js/tournaments.js"></script>
</body>
</html>
